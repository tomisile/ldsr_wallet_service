services:
  postgres:
    image: postgres:18-alpine
    container_name: ldsr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ldsr
      POSTGRES_PASSWORD: ldsr
      POSTGRES_DB: ldsr
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ldsr -d ldsr']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: production
    container_name: ldsr_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Configuration comes from .env, the same file `npm run dev` reads, so a
    # token issued by one runtime verifies against the other. Copy .env.example
    # to .env before starting this profile.
    env_file:
      - .env
    # `environment` overrides `env_file`. DATABASE_URL differs because inside the
    # compose network the database is reachable as `postgres`, not `localhost`.
    environment:
      # Production by default, because this profile runs the production build of
      # the image and exists to mirror the real deployment. Override for a
      # debugging session with: API_NODE_ENV=development docker compose ... up
      # (a distinct name, so NODE_ENV in .env cannot silently change it).
      NODE_ENV: ${API_NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgres://ldsr:ldsr@postgres:5432/ldsr
      DATABASE_SSL: 'false'
      # Fail fast with a readable message rather than booting with a weak secret.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    ports:
      - '3000:3000'
    profiles:
      - full

volumes:
  postgres_data:
