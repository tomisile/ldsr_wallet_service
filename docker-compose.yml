services:
  postgres:
    image: postgres:18-alpine
    container_name: ldsr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ldsr
      POSTGRES_PASSWORD: ldsr
      POSTGRES_DB: ldsr
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ldsr -d ldsr']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: production
    container_name: ldsr_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: ${API_NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgres://ldsr:ldsr@postgres:5432/ldsr
      DATABASE_SSL: 'false'
      # Fail fast with a readable message rather than booting with a weak secret.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    ports:
      - '3000:3000'
    profiles:
      - full

volumes:
  postgres_data:
