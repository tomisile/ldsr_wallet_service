name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  IMAGE_NAME: ldsr-wallet-service

jobs:
  test:
    name: Lint, build and test
    runs-on: ubuntu-latest

    # Ephemeral Postgres for this job only. Same major version as local
    # docker-compose and as the managed database on Render.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ldsr
          POSTGRES_PASSWORD: ldsr
          POSTGRES_DB: ldsr_test
        ports:
          - 5432:5432
        # Without this, steps can start before Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U ldsr -d ldsr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://ldsr:ldsr@localhost:5432/ldsr_test
      DATABASE_SSL: 'false'
      JWT_SECRET: ci_secret_that_is_at_least_thirty_two_characters

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  docker:
    name: Build and push image
    needs: test
    # The `secrets` context is not available in job-level `if`, so the switch is
    # a repository variable. Skips cleanly until Docker Hub is configured.
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push'
      && vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tagged twice on purpose: `latest` is what Render pulls, and the commit
      # SHA makes every deployed image permanently identifiable for rollback.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report digest
        run: echo "Pushed digest ${{ steps.push.outputs.digest }}"

  deploy:
    name: Deploy to Render
    needs: docker
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push'
      && vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest

    steps:
      # Image-backed Render services do not auto-deploy on registry push,
      # so CI tells Render to pull once the new image is available.
      - name: Trigger Render deploy
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
